[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DENABLE_MQTT=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
